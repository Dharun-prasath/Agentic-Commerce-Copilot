version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: copilot_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_pass}
      POSTGRES_DB: ${POSTGRES_DB:-copilot_db}
    ports:
      - "5435:5432"
    volumes:
      - copilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copilot_redis
    ports:
      - "6380:6379"
    volumes:
      - copilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  copilot_postgres_data:
  copilot_redis_data:
